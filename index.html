<style>
  :root{
    --bg: #0d0a08;
    --bg-soft: #15100c;
    --card: #1c1611;
    --card-2: #211a14;
    --line: rgba(224,166,44,0.22);
    --line-strong: rgba(224,166,44,0.45);
    --gold: #e0a62c;
    --gold-bright: #f4c655;
    --gold-deep: #8a611b;
    --cream: #f2ead9;
    --muted: #a3937a;
    --muted-2: #6f6252;
    --danger: #c85c4d;
    --danger-bg: rgba(200,92,77,0.12);
    --success: #6fa876;
    --success-bg: rgba(111,168,118,0.12);
    --radius: 14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(224,166,44,0.08), transparent 60%),
      var(--bg);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .display{font-family:'Anton', sans-serif; letter-spacing:0.5px; text-transform:uppercase;}
  .mono{font-family:'JetBrains Mono', monospace;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  .wrap{max-width:640px; margin:0 auto; padding:0 18px;}

  /* ---------- Header ---------- */
  .topbar{
    padding:22px 18px 16px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .topbar{flex-direction:column; gap:10px;}
  .logo-img{
    width:104px; height:104px; border-radius:50%; display:block;
    box-shadow:0 0 0 1px var(--line-strong), 0 8px 24px rgba(0,0,0,0.5);
  }
  .tagline{
    text-align:center; color:var(--muted); font-size:12.5px;
    letter-spacing:2px; text-transform:uppercase;
  }
  .divider-pole{
    height:6px; margin:22px auto 0; max-width:640px;
    background: repeating-linear-gradient(115deg, var(--gold) 0 14px, transparent 14px 28px);
    opacity:0.35;
  }

  /* ---------- Steps ---------- */
  .step{padding:26px 0 6px;}
  .step-head{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .step-num{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--gold);
    color:var(--gold-bright); font-family:'JetBrains Mono',monospace; font-weight:700; font-size:13px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .step-title{font-family:'Anton',sans-serif; font-size:18px; letter-spacing:0.5px; text-transform:uppercase; color:var(--cream);}
  .step-sub{color:var(--muted); font-size:13px; margin:2px 0 0 36px;}

  /* Chalkboard menu */
  .menu-list{border-top:1px dashed var(--line-strong);}
  .menu-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 4px; border-bottom:1px dashed var(--line-strong);
    cursor:pointer; background:transparent; border-left:none; border-right:none; border-top:none;
    width:100%; text-align:left; color:var(--cream);
  }
  .menu-item .mi-name{font-size:16px; font-weight:600;}
  .menu-item .mi-sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .menu-item .mi-price{font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--gold-bright); font-size:16px; white-space:nowrap;}
  .menu-item.selected{background:linear-gradient(90deg, rgba(224,166,44,0.12), transparent);}
  .menu-item.selected .mi-name{color:var(--gold-bright);}
  .menu-item .check{
    width:20px; height:20px; border-radius:50%; border:1.5px solid var(--muted-2);
    display:inline-flex; align-items:center; justify-content:center; margin-right:12px; flex-shrink:0;
  }
  .menu-item.selected .check{border-color:var(--gold); background:var(--gold);}
  .menu-item.selected .check::after{content:'✓'; color:#151005; font-size:12px; font-weight:700;}
  .mi-left{display:flex; align-items:center;}

  /* Day chips */
  .day-scroll{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; scrollbar-width:none;}
  .day-scroll::-webkit-scrollbar{display:none;}
  .day-chip{
    flex:0 0 auto; width:58px; padding:10px 0; border-radius:12px;
    background:var(--card); border:1px solid var(--line); text-align:center;
    display:flex; flex-direction:column; gap:2px;
  }
  .day-chip .dow{font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}
  .day-chip .dnum{font-family:'Anton',sans-serif; font-size:19px; color:var(--cream);}
  .day-chip.selected{background:var(--gold); border-color:var(--gold);}
  .day-chip.selected .dow{color:#3a2a08;}
  .day-chip.selected .dnum{color:#211603;}

  /* Time grid */
  .slot-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:9px;}
  .slot-btn{
    padding:11px 4px; border-radius:10px; text-align:center;
    background:var(--card); border:1px solid var(--line);
    font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13.5px; color:var(--cream);
  }
  .slot-btn.selected{background:var(--gold); border-color:var(--gold); color:#211603; font-weight:700;}
  .empty-note{
    color:var(--muted); font-size:13.5px; padding:18px 14px; text-align:center;
    background:var(--card); border-radius:12px; border:1px dashed var(--line);
  }

  /* Form */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .field input{
    width:100%; padding:13px 14px; border-radius:10px; background:var(--bg-soft);
    border:1px solid var(--line); color:var(--cream); font-size:15px; font-family:inherit;
  }
  .field input:focus{outline:none; border-color:var(--gold);}

  .summary-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin:16px 0;
  }
  .summary-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
  .summary-row span:first-child{color:var(--muted);}
  .summary-row.total{border-top:1px dashed var(--line-strong); margin-top:6px; padding-top:10px; font-weight:700;}
  .summary-row.total span:last-child{color:var(--gold-bright); font-family:'JetBrains Mono',monospace;}

  .btn-primary{
    width:100%; padding:15px; border-radius:12px; border:none;
    background:linear-gradient(180deg, var(--gold-bright), var(--gold));
    color:#211603; font-weight:700; font-size:15px; letter-spacing:0.3px;
    text-transform:uppercase;
  }
  .btn-primary:disabled{opacity:0.35; }
  .btn-ghost{
    width:100%; padding:13px; border-radius:12px; border:1px solid var(--line-strong);
    background:transparent; color:var(--cream); font-weight:600; font-size:14px; margin-top:10px;
  }
  .btn-danger-line{
    padding:8px 12px; border-radius:8px; border:1px solid var(--danger); background:var(--danger-bg);
    color:var(--danger); font-size:12px; font-weight:600;
  }

  /* Success */

<body>
<div id="app" class="wrap"></div>

<script>
/* ============================================================
   BANCO DE DADOS (storage + backup + cloud sync opcional)
   ------------------------------------------------------------
   Este app usa o objeto "window.storage" dos artifacts do
   Claude.ai. Fora daquele ambiente, criamos uma versão local
   que:

   1) Salva TUDO no localStorage do navegador (banco de dados
      local, grátis, persistente — não some ao fechar a aba).
   2) Tem botões de BACKUP/RESTAURAR no painel admin (você
      baixa um .json com todos os agendamentos e pode
      reimportar quando quiser).
   3) Tem SYNC NA NUVEM OPCIONAL com Supabase (banco de dados
      real, gratuito). Se você configurar, os dados passam a
      ser salvos também na nuvem e ficam disponíveis em todos
      os seus dispositivos. Se não configurar, o app funciona
      100% offline com o localStorage.

   O resto do código continua usando window.storage normalmente
   — toda a lógica do app não muda.
   ============================================================ */

/* ---------- 1) Wrapper local (localStorage) ---------- */
const _LocalStore = {
  _k(shared, key){ return (shared ? 'shared:' : 'priv:') + key; },
  async get(key, shared){
    const v = localStorage.getItem(this._k(shared, key));
    if(v === null) throw new Error('not found');
    return {key, value: v, shared: !!shared};
  },
  async set(key, value, shared){
    localStorage.setItem(this._k(shared, key), value);
    return {key, value, shared: !!shared};
  },
  async delete(key, shared){
    localStorage.removeItem(this._k(shared, key));
    return {key, deleted: true, shared: !!shared};
  },
  async list(prefix, shared){
    const base = (shared ? 'shared:' : 'priv:');
    const p = base + (prefix || '');
    const keys = Object.keys(localStorage)
      .filter(k => k.startsWith(p))
      .map(k => k.slice(base.length));
    return {keys, prefix: prefix || '', shared: !!shared};
  }
};

/* ---------- 2) Cloud (Supabase) — opcional ---------- */
const _Cloud = {
  client: null,
  ready: false,
  init(url, anonKey){
    if(!url || !anonKey){
      this.client = null;
      this.ready = false;
      return false;
    }
    if(typeof supabase === 'undefined'){
      console.warn('Supabase lib não carregou. Sync na nuvem desativado.');
      this.client = null;
      this.ready = false;
      return false;
    }
    try{
      this.client = supabase.createClient(url, anonKey);
      this.ready = true;
      return true;
    }catch(e){
      console.error('Falha ao iniciar Supabase:', e);
      this.client = null;
      this.ready = false;
      return false;
    }
  },
  async pushAll(data){
    if(!this.ready) return {ok:false, reason:'not-configured'};
    try{
      // data = { services, days: { iso: {available, bookings} }, notifySettings }
      // Estratégia simples: apaga tudo do "tenant" e regrava. Volume pequeno
      // (serviços + dias), totalmente OK para uma barbearia.
      const url = this.client;
      // services
      await this.client.from('services').delete().neq('id', '');
      if(data.services && data.services.length){
        await this.client.from('services').insert(
          data.services.map(s => ({ id: s.id, name: s.name, price: s.price }))
        );
      }
      // days
      await this.client.from('days').delete().neq('iso', '');
      const dayRows = Object.entries(data.days || {}).map(([iso, d]) => ({
        iso, available: d.available || [], bookings: d.bookings || {}
      }));
      if(dayRows.length){
        await this.client.from('days').insert(dayRows);
      }
      // notify settings (uma linha por "tenant" — usamos um id fixo 'default')
      if(data.notifySettings){
        await this.client.from('settings').upsert({
          id: 'default', value: data.notifySettings
        });
      }
      return {ok:true, ts: Date.now()};
    }catch(e){
      console.error('pushAll falhou:', e);
      return {ok:false, reason: (e && e.message) || 'unknown'};
    }
  },
  async pullAll(){
    if(!this.ready) return null;
    try{
      const [svc, days, settings] = await Promise.all([
        this.client.from('services').select('*'),
        this.client.from('days').select('*'),
        this.client.from('settings').select('*').eq('id', 'default').maybeSingle()
      ]);
      const services = (svc.data || []).map(s => ({id:s.id, name:s.name, price:s.price}));
      const daysObj = {};
      (days.data || []).forEach(d => { daysObj[d.iso] = {available:d.available||[], bookings:d.bookings||{}}; });
      const notifySettings = settings.data ? settings.data.value : null;
      return {services, days: daysObj, notifySettings};
    }catch(e){
      console.error('pullAll falhou:', e);
      return null;
    }
  }
};

/* ---------- 3) Camada unificada: window.storage ----------
   Mantém a API original. Quando Supabase está configurado,
   cada set() também empurra pra nuvem em background. */
const _prefixFor = (shared) => shared ? 'shared:' : 'priv:';

const _DB = {
  cloudEnabled(){ return _Cloud.ready; },
  cloudInit(url, key){ return _Cloud.init(url, key); },
  async getConfig(){
    try{ return JSON.parse((await _LocalStore.get('cloud-config', false)).value); }
    catch(e){ return null; }
  },
  async setConfig(cfg){
    await _LocalStore.set('cloud-config', JSON.stringify(cfg || {}), false);
    if(cfg && cfg.url && cfg.anonKey){
      _Cloud.init(cfg.url, cfg.anonKey);
    } else {
      _Cloud.ready = false; _Cloud.client = null;
    }
  },
  /* Backup/restore locais */
  async exportAll(){
    const services = await getServices();
    const dayKeys = (await _LocalStore.list('day:', true)).keys;
    const days = {};
    for(const k of dayKeys){
      try{
        const r = await _LocalStore.get(k, true);
        days[k.replace(/^day:/, '')] = JSON.parse(r.value);
      }catch(e){}
    }
    const notify = await getNotifySettings();
    return {
      schema: '7barber-backup',
      version: 1,
      exportedAt: new Date().toISOString(),
      services, days, notify
    };
  },
  async importAll(data, opts = {}){
    if(!data || data.schema !== '7barber-backup'){
      throw new Error('Arquivo de backup inválido.');
    }
    if(data.services){
      await saveServices(data.services);
    }
    if(data.days){
      for(const [iso, obj] of Object.entries(data.days)){
        await saveDay(iso, obj);
      }
    }
    if(data.notify){
      await saveNotifySettings(data.notify);
    }
    if(opts.pushToCloud && _Cloud.ready){
      await _Cloud.pushAll({
        services: data.services || [],
        days: data.days || {},
        notifySettings: data.notify
      });
    }
    return {ok:true, services: (data.services||[]).length, days: Object.keys(data.days||{}).length};
  }
};

if(!window.storage){
  // Implementação padrão = local. Se Supabase estiver configurado,
  // também sincroniza pra nuvem (em background, sem bloquear).
  window.storage = {
    async get(key, shared){
      return _LocalStore.get(key, shared);
    },
    async set(key, value, shared){
      const r = await _LocalStore.set(key, value, shared);
      // background sync: só sincroniza as chaves "compartilhadas"
      if(shared && _Cloud.ready){
        _syncSingleKey(key).catch(e => console.warn('cloud sync falhou:', e));
      }
      return r;
    },
    async delete(key, shared){
      return _LocalStore.delete(key, shared);
    },
    async list(prefix, shared){
      return _LocalStore.list(prefix, shared);
    }
  };
}

/* Sincroniza uma chave específica na nuvem após escrita local */
async function _syncSingleKey(key){
  if(!_Cloud.ready) return;
  if(key === 'services'){
    const services = await getServices();
    await _Cloud.pushAll({ services, days: {}, notifySettings: null });
  } else if(key.startsWith('day:')){
    // coleta todos os dias e empurra junto
    const data = await _DB.exportAll();
    await _Cloud.pushAll({
      services: data.services,
      days: data.days,
      notifySettings: data.notify
    });
  } else if(key === 'notify-settings'){
    const notify = await getNotifySettings();
    await _Cloud.pushAll({ services: [], days: {}, notifySettings: notify });
  }
}

/* Carrega lib do Supabase sob demanda (só se o usuário ativar) */
function _loadSupabaseLib(){
  return new Promise((resolve, reject) => {
    if(typeof supabase !== 'undefined') return resolve();
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('Falha ao carregar Supabase.'));
    document.head.appendChild(s);
  });
}

/* ============ CONFIG ============ */
const LOGO_DATA_URI = document.querySelector('link[rel="icon"]').href;
const ADMIN_PASSWORD = "7barber2026"; // altere aqui se quiser outra senha
const CALLMEBOT_ENABLED_BY_DEFAULT = false;
const TIME_START = 8, TIME_END = 20, TIME_STEP = 30; // grade de horários possíveis (admin libera os que quiser)
const DEFAULT_SERVICES = [
  {id:'corte', name:'Corte', price:25},
  {id:'corte-barba', name:'Corte e Barba', price:35}
];
const WEEKDAYS = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MONTHS = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

function generateSlots(){
  const out=[];
  for(let h=TIME_START; h<TIME_END; h++){
    for(let m=0; m<60; m+=TIME_STEP){
      out.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
    }
  }
  return out;
}
const TIME_SLOTS = generateSlots();

function toISO(d){ return d.toISOString().slice(0,10); }
function nextDays(n){
  const out=[];
  const today = new Date();
  today.setHours(0,0,0,0);
  for(let i=0;i<n;i++){
    const d = new Date(today);
    d.setDate(d.getDate()+i);
    out.push(d);
  }
  return out;
}
function fmtDayLabel(d){ return {dow: WEEKDAYS[d.getDay()], num: d.getDate()}; }
function fmtDateFull(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return d + ' de ' + MONTHS[m-1] + ' de ' + y;
}
function money(v){ return 'R$ ' + Number(v).toFixed(2).replace('.',','); }

/* ============ STORAGE ============ */
async function getServices(){
  try{
    const res = await window.storage.get('services', true);
    return res ? JSON.parse(res.value) : DEFAULT_SERVICES;
  }catch(e){
    await window.storage.set('services', JSON.stringify(DEFAULT_SERVICES), true).catch(()=>{});
    return DEFAULT_SERVICES;
  }
}
async function saveServices(list){
  await window.storage.set('services', JSON.stringify(list), true);
}
async function getDay(iso){
  try{
    const res = await window.storage.get('day:'+iso, true);
    return res ? JSON.parse(res.value) : {available:[], bookings:{}};
  }catch(e){
    return {available:[], bookings:{}};
  }
}
async function saveDay(iso, obj){
  await window.storage.set('day:'+iso, JSON.stringify(obj), true);
}
async function getNotifySettings(){
  try{
    const res = await window.storage.get('notify-settings', true);
    return res ? JSON.parse(res.value) : {
      enabled:false, channel:'telegram',
      telegram:{token:'', chatId:''},
      green:{instanceId:'', apiToken:'', chatId:''},
      whatsapp:{phone:'', apikey:''}
    };
  }catch(e){
    return {
      enabled:false, channel:'telegram',
      telegram:{token:'', chatId:''},
      green:{instanceId:'', apiToken:'', chatId:''},
      whatsapp:{phone:'', apikey:''}
    };
  }
}
async function saveNotifySettings(s){
  await window.storage.set('notify-settings', JSON.stringify(s), true);
}
async function sendNotification(text){
  const s = state.notifySettings;
  if(!s || !s.enabled) return {ok:false, reason:'disabled'};

  if(s.channel==='telegram'){
    const t = s.telegram || {};
    if(!t.token || !t.chatId) return {ok:false, reason:'not-configured'};
    const url = 'https://api.telegram.org/bot' + encodeURIComponent(t.token) +
                '/sendMessage?chat_id=' + encodeURIComponent(t.chatId) +
                '&text=' + encodeURIComponent(text);
    try{
      const res = await fetch(url);
      const data = await res.json().catch(()=>null);
      if(data && data.ok) return {ok:true};
      return {ok:false, reason:(data && data.description) || 'telegram-error'};
    }catch(e){
      console.warn('Falha ao enviar notificação Telegram', e);
      return {ok:false, reason:'network'};
    }
  }

  if(s.channel==='whatsapp-green'){
    const g = s.green || {};
    if(!g.instanceId || !g.apiToken || !g.chatId) return {ok:false, reason:'not-configured'};
    const url = 'https://api.green-api.com/waInstance' + encodeURIComponent(g.instanceId) +
                '/sendMessage/' + encodeURIComponent(g.apiToken);
    try{
      const res = await fetch(url, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ chatId: g.chatId, message: text })
      });
      const data = await res.json().catch(()=>null);
      if(res.ok && data && data.idMessage) return {ok:true};
      return {ok:false, reason:(data && data.message) || 'green-api-error'};
    }catch(e){
      console.warn('Falha ao enviar notificação Green-API', e);
      return {ok:false, reason:'network'};
    }
  }

  if(s.channel==='whatsapp-callmebot'){
    const w = s.whatsapp || {};
    if(!w.phone || !w.apikey) return {ok:false, reason:'not-configured'};
    const url = 'https://api.callmebot.com/whatsapp.php?phone=' + encodeURIComponent(w.phone) +
                '&text=' + encodeURIComponent(text) + '&apikey=' + encodeURIComponent(w.apikey);
    try{
      await fetch(url, {mode:'no-cors'});
      return {ok:true};
    }catch(e){
      console.warn('Falha ao enviar notificação WhatsApp', e);
      return {ok:false, reason:'network'};
    }
  }
  return {ok:false, reason:'no-channel'};
}

/* ============ PUSH NOTIFICATIONS DE VERDADE ============
   Diferente da versão antiga (que precisava da aba do site aberta),
   isso usa Service Worker + Web Push: o pop-up chega mesmo com o
   navegador fechado, direto do sistema operacional — igual notificação
   de app de celular. Só quem clicar em "Ativar" no painel admin recebe;
   visitantes comuns do site nunca veem nada disso. */

const VAPID_PUBLIC_KEY = 'BILJgp1oZkw4cj3tXoUl1Cx6eIMSt6WbutBJGORkTLmARRyktuNR7teWi8nGegIqx7o7d87FZeJTLF1_TsnuL2E';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i=0; i<rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function ensureServiceWorker(){
  if(!('serviceWorker' in navigator)) return null;
  try{
    return await navigator.serviceWorker.register('sw.js');
  }catch(e){
    console.warn('Falha ao registrar service worker', e);
    return null;
  }
}

/* Registra o service worker cedo (sem pedir permissão ainda) pra já
   deixar pronto pra quando o admin clicar em ativar. */
if('serviceWorker' in navigator){
  ensureServiceWorker();
}

async function enableBrowserNotify(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    showToast('Este navegador não suporta notificações push.');
    return;
  }
  const perm = await Notification.requestPermission();
  state.browserNotifyPermission = perm;
  if(perm !== 'granted'){
    showToast('Permissão não concedida pelo navegador.');
    render();
    return;
  }
  try{
    const reg = await ensureServiceWorker();
    if(!reg){ showToast('Não foi possível registrar o service worker.'); render(); return; }
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    if(_DB.cloudEnabled() && _Cloud.client){
      await _Cloud.client.from('push_subscriptions').upsert(
        { endpoint: sub.endpoint, subscription: sub.toJSON() },
        { onConflict: 'endpoint' }
      );
    }
    showToast('Notificações ativadas! Vão chegar mesmo com o site fechado.');
  }catch(e){
    console.error('Falha ao ativar push:', e);
    showToast('Falha ao ativar notificações push.');
  }
  render();
}

async function testBrowserNotify(){
  if(Notification.permission !== 'granted'){
    showToast('Ative as notificações primeiro.');
    return;
  }
  const reg = await ensureServiceWorker();
  if(!reg){ showToast('Ative as notificações primeiro.'); return; }
  reg.showNotification('💈 Novo agendamento — mais uma venda!', {
    body: 'Corte (teste) — ' + money(25) + '\n' + fmtDateFull(state.selectedDate || toISO(new Date())) + ' às 00:00\nCliente: Cliente Teste',
    tag: 'teste-push',
    requireInteraction: true
  });
  showToast('Pop-up de teste enviado (esse é só local — o de agendamento real passa pelo servidor).');
}

/* ============ STATE ============ */
let state = {
  view: 'client', // client | adminLogin | admin
  adminUnlocked: false,

  dayData: {available:[], bookings:{}},

  form: {name:'', phone:''},
  lastBooking: null,
  adminTab: 'agenda', // agenda | servicos | notificacoes | backup
  cloudCfg: {url:'https://fxnjgrvruyusjgdqfnnn.supabase.co', anonKey:'sb_publishable_D4aghurrE_ScF-eKLNzXWw_ETmmSaSs'},
  adminDate: toISO(new Date()),
  adminDayData: {available:[], bookings:{}},

/* ============ INIT ============ */
/* Config padrão do Supabase (preenchida na publicação).
   Se quiser trocar, é só abrir o painel admin → aba "Dados" e colar outra URL/chave.
   Ou apague a config e conecte outro projeto a qualquer momento. */
const DEFAULT_CLOUD_CONFIG = {
  url: 'https://fxnjgrvruyusjgdqfnnn.supabase.co',
  anonKey: 'sb_publishable_D4aghurrE_ScF-eKLNzXWw_ETmmSaSs'
};

async function init(){
  state.services = await getServices();
  state.notifySettings = await getNotifySettings();
  // 1) Se já tem config salva, usa ela
  // 2) Senão, usa a config padrão (Supabase da 7 Barber)
  let cfg = await _DB.getConfig();
  if(!cfg || !cfg.url || !cfg.anonKey){
    cfg = {...DEFAULT_CLOUD_CONFIG};
    // Salva a padrão pra próxima vez
    try{ await _DB.setConfig(cfg); }catch(e){}
  }
  state.cloudCfg = cfg;
  // Tenta inicializar sync na nuvem
  try{
    await _loadSupabaseLib();
    _DB.cloudInit(cfg.url, cfg.anonKey);
    if(_DB.cloudEnabled()){
      // Faz um pull inicial da nuvem pra pegar tudo que estiver lá
      // (e mostra um toast de "sincronizado" se vier algo)
      const cloud = await _Cloud.pullAll();
      const localDays = (await _LocalStore.list('day:', true)).keys.length;
      const localServices = state.services.length;
      if(cloud){
        const cloudDays = Object.keys(cloud.days||{}).length;
        const cloudServices = (cloud.services||[]).length;
        // A nuvem é a fonte de verdade compartilhada por todo mundo que abre o
        // site (clientes agendando + admin). Por isso, NUNCA perguntamos nada
        // aqui com confirm() — isso aparecia pra qualquer visitante do site,
        // o que estava errado. Se a nuvem tem dados, só trazemos silenciosamente.
        if(cloudDays > 0 && (cloudDays > localDays || cloudServices > localServices)){
          await _DB.importAll({schema:'7barber-backup', version:1, ...cloud});
          state.services = await getServices();
          state.notifySettings = await getNotifySettings();
          await loadClientDay(state.selectedDate);
        }
        // Se o local tem mais que a nuvem, faz um push — mas só quando for o
        // painel do admin fazendo isso (visitante comum nunca deveria escrever
        // dados "de dono" na nuvem).
        else if((localDays > 0 || localServices > 0) && state.adminUnlocked){
          await doCloudPushSilent();
        }
      }
    }
  }catch(e){
    console.warn('Cloud init falhou:', e);
  }
  await loadClientDay(state.selectedDate);
  render();
}

async function doCloudPushSilent(){
  if(!_DB.cloudEnabled()) return;
  try{
    const data = await _DB.exportAll();
    await _Cloud.pushAll({
      services: data.services,
      days: data.days,
      notifySettings: data.notify
    });
  }catch(e){ console.warn('push falhou:', e); }
}

    <button class="btn-ghost" data-action="cloud-disconnect" style="color:var(--danger);">Desconectar da nuvem</button>` : ''}
    <button class="btn-ghost" data-action="test-cloud" style="margin-top:6px;">Testar conexão</button>

    <div class="section-label" style="margin-top:22px;">Status do armazenamento local</div>
    <div id="local-stats" class="empty-note" style="text-align:left; font-family:'JetBrains Mono',monospace; font-size:12px; line-height:1.8;">
      carregando…
    </div>
  `;
}

function renderAdmin(){
  return `
    <div class="admin-header">
      <div class="a-title">Painel 7 Barber</div>
      <button class="exit-link" data-action="go-client">← ver site</button>
    </div>
    <div class="tabs">
      <button class="tab-btn ${state.adminTab==='agenda'?'active':''}" data-action="admin-tab" data-tab="agenda">Agenda</button>
      <button class="tab-btn ${state.adminTab==='servicos'?'active':''}" data-action="admin-tab" data-tab="servicos">Serviços</button>
      <button class="tab-btn ${state.adminTab==='notificacoes'?'active':''}" data-action="admin-tab" data-tab="notificacoes">Notificações</button>
      <button class="tab-btn ${state.adminTab==='backup'?'active':''}" data-action="admin-tab" data-tab="backup">Dados</button>
    </div>
    ${state.adminTab==='agenda' ? renderAdminAgenda() :
      state.adminTab==='servicos' ? renderAdminServicos() :
      state.adminTab==='backup' ? renderAdminBackup() :
      renderAdminNotify()}
  `;
}

/* ============ ROOT RENDER ============ */
function render(){
  const app = document.getElementById('app');
  let inner = '';

  if(state.view==='client'){
    inner = `
      <div class="topbar">
        <img src="${LOGO_DATA_URI}" alt="7 Barber" class="logo-img">
        <div class="tagline">Agende seu horário</div>
      </div>
      <div class="divider-pole"></div>
      ${renderClient()}
    `;
  } else if(state.view==='adminLogin'){
    inner = renderAdminLogin();
  } else if(state.view==='admin'){
    inner = renderAdmin();
  }

  app.innerHTML = inner + (state.toast ? `<div class="toast">${state.toast}</div>` : '');
  attachHandlers();
}

/* ============ EVENTS ============ */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('[data-bind]').forEach(el=>{
    el.addEventListener('input', onBind);
  });
  const dateInput = document.getElementById('admin-date-input');
  if(dateInput){ dateInput.addEventListener('change', onAdminDateChange); }
}

function onBind(e){
  const key = e.target.getAttribute('data-bind');
  if(key==='name'){ state.form.name = e.target.value; }
  else if(key==='phone'){ state.form.phone = e.target.value; }
  else if(key==='pass'){ state.pendingPass = e.target.value; }
  else if(key==='svc-name'){ state.newService.name = e.target.value; }
  else if(key==='svc-price'){ state.newService.price = e.target.value; }
  else if(key==='telegram-token'){ state.notifySettings.telegram = state.notifySettings.telegram || {}; state.notifySettings.telegram.token = e.target.value; }
  else if(key==='telegram-chatid'){ state.notifySettings.telegram = state.notifySettings.telegram || {}; state.notifySettings.telegram.chatId = e.target.value; }
  else if(key==='green-instance'){ state.notifySettings.green = state.notifySettings.green || {}; state.notifySettings.green.instanceId = e.target.value; }
  else if(key==='green-token'){ state.notifySettings.green = state.notifySettings.green || {}; state.notifySettings.green.apiToken = e.target.value; }
  else if(key==='green-chatid'){ state.notifySettings.green = state.notifySettings.green || {}; state.notifySettings.green.chatId = e.target.value; }
  else if(key==='whatsapp-phone'){ state.notifySettings.whatsapp = state.notifySettings.whatsapp || {}; state.notifySettings.whatsapp.phone = e.target.value; }
  else if(key==='whatsapp-apikey'){ state.notifySettings.whatsapp = state.notifySettings.whatsapp || {}; state.notifySettings.whatsapp.apikey = e.target.value; }
  else if(key==='cloud-url'){ state.cloudCfg = state.cloudCfg || {}; state.cloudCfg.url = e.target.value.trim(); }
  else if(key==='cloud-key'){ state.cloudCfg = state.cloudCfg || {}; state.cloudCfg.anonKey = e.target.value.trim(); }
  // avoid full re-render on every keystroke for text fields to keep focus & caret
  if(key==='name' || key==='phone'){
    const btn = document.getElementById('confirm-btn');
    if(btn){ btn.disabled = !(state.form.name.trim() && state.form.phone.trim()); }
  }
}

async function onAdminDateChange(e){
  state.adminDate = e.target.value;
  await loadAdminDay(state.adminDate);
}

async function onAction(e){
  const action = e.currentTarget.getAttribute('data-action');

  if(action==='select-service'){
    state.selectedServiceId = e.currentTarget.getAttribute('data-id');
    render();
  }
  else if(action==='select-date'){
    const iso = e.currentTarget.getAttribute('data-date');
    state.selectedDate = iso;
    state.selectedTime = null;
    await loadClientDay(iso);
  }
  else if(action==='select-time'){
    state.selectedTime = e.currentTarget.getAttribute('data-time');
    render();
  }
  else if(action==='confirm-booking'){
    await confirmBooking();
  }
  else if(action==='reset'){
    state.bookedStep='form';
    state.selectedServiceId=null;
    state.selectedTime=null;
    state.form={name:'',phone:''};
    state.lastBooking=null;
    render();
  }
  else if(action==='go-admin'){
    state.view = state.adminUnlocked ? 'admin' : 'adminLogin';
    if(state.view==='admin'){ await loadAdminDay(state.adminDate); }
    render();
  }
  else if(action==='go-client'){
    state.view='client';
    render();
  }
  else if(action==='do-login'){
    if((state.pendingPass||'') === ADMIN_PASSWORD){
      state.adminUnlocked = true;
      state.view='admin';
      state.loginError=null;
      await loadAdminDay(state.adminDate);
    } else {
      state.loginError = 'Senha incorreta. Tente novamente.';
      render();
    }
  }
  else if(action==='admin-tab'){
    state.adminTab = e.currentTarget.getAttribute('data-tab');
    render();
    if(state.adminTab==='backup'){ updateLocalStats(); }
  }
  else if(action==='toggle-slot'){
    await toggleSlot(e.currentTarget.getAttribute('data-time'));
  }
  else if(action==='release-slot'){
    await releaseSlot(e.currentTarget.getAttribute('data-time'));
  }
  else if(action==='add-service'){
    await addService();
  }
  else if(action==='delete-service'){
    await deleteService(e.currentTarget.getAttribute('data-id'));
  }
  else if(action==='save-notify'){
    await saveNotifySettingsFromForm();
  }
  else if(action==='switch-channel'){
    state.notifySettings.channel = e.currentTarget.getAttribute('data-channel');
    render();
  }
  else if(action==='disable-notify'){
    state.notifySettings.enabled = false;
    await saveNotifySettings(state.notifySettings);
    showToast('Notificações desativadas.');
  }
  else if(action==='test-notify'){
    await testNotify();
  }
  else if(action==='enable-browser-notify'){
    await enableBrowserNotify();
  }
  else if(action==='test-browser-notify'){
    testBrowserNotify();
  }
  /* ===== Backup & Cloud Sync ===== */
  else if(action==='export-backup'){
    await doExportBackup();
  }
  else if(action==='import-backup'){
    document.getElementById('import-file').click();
  }
  else if(action==='import-backup-file'){
    // handled by the change listener below
  }
  else if(action==='save-cloud'){
    await doSaveCloud();
  }
  else if(action==='cloud-push'){
    await doCloudPush();
  }
  else if(action==='cloud-pull'){
    await doCloudPull();
  }
  else if(action==='cloud-disconnect'){
    await doCloudDisconnect();
  }
  else if(action==='test-cloud'){
    await doTestCloud();
  }
}

/* Listener do input file de importação */
document.addEventListener('change', async (e)=>{
  if(e.target && e.target.id === 'import-file'){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    try{
      const text = await f.text();
      const data = JSON.parse(text);
      const r = await _DB.importAll(data);
      // recarrega estado
      state.services = await getServices();
      state.notifySettings = await getNotifySettings();
      if(state.view==='admin'){
        await loadAdminDay(state.adminDate);
      } else {
        await loadClientDay(state.selectedDate);
      }
      render();
      showToast('Backup restaurado: ' + r.services + ' serviços, ' + r.days + ' dias.');
    }catch(err){
      showToast('Arquivo inválido: ' + (err.message||err));
    } finally {
      e.target.value = '';
    }
  }
});

async function doExportBackup(){
  try{
    const data = await _DB.exportAll();
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    a.href = url;
    a.download = '7barber-backup-' + ts + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Backup baixado.');
  }catch(e){
    showToast('Falha ao exportar: ' + (e.message||e));
  }
}

async function doSaveCloud(){
  const cfg = state.cloudCfg || {};
  if(!cfg.url || !cfg.anonKey){
    showToast('Preencha URL e chave anon.');
    return;
  }
  if(!cfg.url.startsWith('https://')){
    showToast('URL inválida. Deve começar com https://');
    return;
  }
  try{
    showToast('Conectando…');
    await _loadSupabaseLib();
    const ok = _DB.cloudInit(cfg.url, cfg.anonKey);
    if(!ok){
      showToast('Não foi possível iniciar o Supabase. Confira a URL e a chave.');
      return;
    }
    await _DB.setConfig({url: cfg.url, anonKey: cfg.anonKey});
    showToast('Sync na nuvem ativado!');
    render();
  }catch(e){
    showToast('Erro: ' + (e.message||e));
  }
}

async function doTestCloud(){
  if(!_DB.cloudEnabled()){
    showToast('Ative o sync primeiro.');
    return;
  }
  showToast('Testando…');
  const result = await _Cloud.pushAll({
    services: await getServices(),
    days: {}, notifySettings: null
  });
  if(result.ok) showToast('✅ Conexão OK! Dados enviados.');
  else showToast('Falhou: ' + (result.reason||'erro'));
}

async function doCloudPush(){
  if(!_DB.cloudEnabled()){
    showToast('Ative o sync primeiro.');
    return;
  }
  showToast('Enviando…');
  const data = await _DB.exportAll();
  const result = await _Cloud.pushAll({
    services: data.services,
    days: data.days,
    notifySettings: data.notify
  });
  if(result.ok) showToast('☁️ Enviado pra nuvem.');
  else showToast('Falhou: ' + (result.reason||'erro'));
}

async function doCloudPull(){
  if(!_DB.cloudEnabled()){
    showToast('Ative o sync primeiro.');
    return;
  }
  if(!confirm('Isso vai SUBSTITUIR todos os dados locais pelos da nuvem. Continuar?')) return;
  showToast('Baixando…');
  const data = await _Cloud.pullAll();
  if(!data){
    showToast('Falha ao baixar.');
    return;
  }
  await _DB.importAll({schema:'7barber-backup', version:1, ...data});
  state.services = await getServices();
  state.notifySettings = await getNotifySettings();
  if(state.view==='admin') await loadAdminDay(state.adminDate);
  else await loadClientDay(state.selectedDate);
  render();
  showToast('⬇️ Dados da nuvem carregados.');
}

async function doCloudDisconnect(){
  if(!confirm('Desconectar da nuvem? Os dados locais continuam salvos.')) return;
  await _DB.setConfig({url:'', anonKey:''});
  state.cloudCfg = {url:'', anonKey:''};
  showToast('Desconectado.');
  render();
}

async function updateLocalStats(){
  const el = document.getElementById('local-stats');
  if(!el) return;
  try{
    const data = await _DB.exportAll();
    const dayCount = Object.keys(data.days).length;
    let bookingCount = 0;
    let totalRevenue = 0;
    for(const d of Object.values(data.days)){
      const bs = d.bookings || {};
      for(const b of Object.values(bs)){
        bookingCount++;
        totalRevenue += Number(b.price || 0);
      }
    }
    // estimativa de uso do localStorage
    let usedBytes = 0;
    for(let i=0; i<localStorage.length; i++){
      const k = localStorage.key(i);
      usedBytes += (k.length + (localStorage.getItem(k)||'').length) * 2; // utf-16
    }
    const usedKB = (usedBytes/1024).toFixed(1);
    const quotaMB = 5; // maioria dos navegadores
    el.innerHTML =
      `Serviços: <strong>${data.services.length}</strong><br>` +
      `Dias com horário: <strong>${dayCount}</strong><br>` +
      `Agendamentos salvos: <strong>${bookingCount}</strong><br>` +
      `Faturamento registrado: <strong>R$ ${totalRevenue.toFixed(2).replace('.',',')}</strong><br>` +
      `Espaço usado no navegador: <strong>${usedKB} KB</strong> de ~${quotaMB} MB disponíveis`;
  }catch(e){
    el.textContent = 'Erro ao ler dados: ' + (e.message||e);
  }
}

async function confirmBooking(){
  const svc = state.services.find(s=>s.id===state.selectedServiceId);
  if(!svc || !state.selectedDate || !state.selectedTime) return;

  // revalidate against latest data to avoid double-booking
  const fresh = await getDay(state.selectedDate);
  if(!fresh.available.includes(state.selectedTime) || (fresh.bookings && fresh.bookings[state.selectedTime])){
    showToast('Esse horário acabou de ser reservado. Escolha outro, por favor.');
    await loadClientDay(state.selectedDate);
    state.selectedTime = null;
    render();
    return;
  }

  fresh.bookings = fresh.bookings || {};
  fresh.bookings[state.selectedTime] = {
    name: state.form.name.trim(),
    phone: state.form.phone.trim(),
    serviceId: svc.id,
    serviceName: svc.name,
    price: svc.price
  };
  await saveDay(state.selectedDate, fresh);

  state.lastBooking = {
    date: state.selectedDate,
    time: state.selectedTime,
    name: state.form.name.trim(),
    serviceName: svc.name,
    price: svc.price
  };
  state.bookedStep='success';
  render();

  const notifyText = '💈 Novo agendamento — 7 Barber\n' +
    svc.name + ' (' + money(svc.price) + ')\n' +
    fmtDateFull(state.selectedDate) + ' às ' + state.selectedTime + '\n' +
    'Cliente: ' + state.form.name.trim() + ' — ' + state.form.phone.trim();
  sendNotification(notifyText);

  // Dispara o pop-up push (chega no navegador do admin mesmo fechado).
  // Insere um evento na nuvem; um Database Webhook do Supabase escuta
  // essa tabela e chama a Edge Function que manda a notificação real.
  if(_DB.cloudEnabled() && _Cloud.client){
    _Cloud.client.from('booking_events').insert({
      iso: state.selectedDate,
      time: state.selectedTime,
      service_name: svc.name,
      price: svc.price,
      client_name: state.form.name.trim()
    }).then(({error}) => {
      if(error) console.warn('Falha ao registrar evento de push:', error);
    });
  }
}

async function toggleSlot(time){
  const day = state.adminDayData;
  day.bookings = day.bookings || {};
  day.available = day.available || [];
  if(day.bookings[time]){
    showToast('Esse horário já tem um agendamento. Use "Liberar horário" para cancelar.');
    return;
  }
  if(day.available.includes(time)){
    day.available = day.available.filter(t=>t!==time);
  } else {
    day.available.push(time);
  }
  await saveDay(state.adminDate, day);
  render();
}

async function releaseSlot(time){
  const day = state.adminDayData;
  if(day.bookings && day.bookings[time]){
    delete day.bookings[time];
    // slot stays open (available) so it can be booked again, unless admin wants it closed
    await saveDay(state.adminDate, day);
    showToast('Horário liberado.');
    render();
  }
}

async function addService(){
  const name = (state.newService.name||'').trim();
  const price = parseFloat((state.newService.price||'').replace(',','.'));
  if(!name || isNaN(price) || price<0){
    showToast('Preencha nome e preço válidos.');
    return;
  }
  const id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Date.now().toString(36);
  state.services.push({id, name, price});
  await saveServices(state.services);
  state.newService = {name:'', price:''};
  showToast('Serviço adicionado.');
  render();
}

async function deleteService(id){
  state.services = state.services.filter(s=>s.id!==id);
  await saveServices(state.services);
  render();
}

async function saveNotifySettingsFromForm(){
  const channel = state.notifySettings.channel || 'telegram';
  if(channel==='telegram'){
    const t = state.notifySettings.telegram || {};
    if(!(t.token||'').trim() || !(t.chatId||'').trim()){
      showToast('Preencha o token e o chat ID antes de salvar.');
      return;
    }
    t.token = t.token.trim(); t.chatId = t.chatId.trim();
    state.notifySettings.telegram = t;
  } else if(channel==='whatsapp-green'){
    const g = state.notifySettings.green || {};
    if(!(g.instanceId||'').trim() || !(g.apiToken||'').trim() || !(g.chatId||'').trim()){
      showToast('Preencha ID da instância, token e número antes de salvar.');
      return;
    }
    g.instanceId = g.instanceId.trim(); g.apiToken = g.apiToken.trim(); g.chatId = g.chatId.trim();
    state.notifySettings.green = g;
  } else {
    const w = state.notifySettings.whatsapp || {};
    if(!(w.phone||'').trim() || !(w.apikey||'').trim()){
      showToast('Preencha o número e a APIKEY antes de salvar.');
      return;
    }
    w.phone = w.phone.trim(); w.apikey = w.apikey.trim();
    state.notifySettings.whatsapp = w;
  }
  state.notifySettings.enabled = true;
  await saveNotifySettings(state.notifySettings);
  showToast('Configurações salvas. Notificações ativadas!');
  render();
}

async function testNotify(){
  const channel = state.notifySettings.channel || 'telegram';
  const configured = channel==='telegram'
    ? ((state.notifySettings.telegram||{}).token && (state.notifySettings.telegram||{}).chatId)
    : channel==='whatsapp-green'
    ? ((state.notifySettings.green||{}).instanceId && (state.notifySettings.green||{}).apiToken && (state.notifySettings.green||{}).chatId)
    : ((state.notifySettings.whatsapp||{}).phone && (state.notifySettings.whatsapp||{}).apikey);
  if(!configured){
    showToast('Preencha os campos antes de testar.');
    return;
  }
  const wasEnabled = state.notifySettings.enabled;
  state.notifySettings.enabled = true; // force send for the test regardless of saved state
  const result = await sendNotification('✅ Teste 7 Barber: as notificações estão funcionando!');
  state.notifySettings.enabled = wasEnabled;
  if(result.ok){
    showToast('Mensagem de teste enviada. Confira lá.');
  } else {
    showToast('Não foi possível enviar agora. Confira os dados preenchidos.');
  }
}

init();
</script>
